<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Rounded hex / shield container -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#111111" stroke="#262626" stroke-width="2"/>
  <!-- Glowing orange gradient cloud & block -->
  <defs>
    <linearGradient id="sbgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>
  <!-- Builder isometric block -->
  <path d="M 60 28 L 88 44 L 60 60 L 32 44 Z" fill="url(#sbgGrad)"/>
  <path d="M 32 46 L 60 62 L 60 92 L 32 76 Z" fill="#E68A00"/>
  <path d="M 88 46 L 60 62 L 60 92 L 88 76 Z" fill="#CC7A00"/>
  <!-- White gear/center accent -->
